[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/tao-dev/skills/tao-dev/scripts"]
addopts = "-ra"

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["${TAO_COVERAGE_SOURCE-plugins/tao-dev/skills/tao-dev/scripts/taolib}"]
data_file = "${TAO_COVERAGE_DATA-tmp/tao/coverage/.coverage}"

[tool.coverage.report]
show_missing = true
