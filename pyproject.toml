[project]
name = "tao-dev"
version = "0.4.0"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["markdown-it-py>=3,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
publication = ["Sphinx>=8,<10", "myst-parser>=4,<6", "sphinx-book-theme>=1,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "coverage>=7.10.6,<8",
    "ruff>=0.15,<1",
    "mini-racer>=0.14.1,<0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/tao-dev/skills/tao-dev/scripts"]
addopts = "-ra"

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["${TAO_COVERAGE_SOURCE-plugins/tao-dev/skills/tao-dev/scripts}"]
data_file = "${TAO_COVERAGE_DATA-tmp/tao/coverage/.coverage}"

[tool.coverage.report]
show_missing = true
