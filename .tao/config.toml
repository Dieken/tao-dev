version = 1
locale = "zh-Hans"

[documents]
include = ["docs/**/*.md"]
book_root = "docs/index.md"

[verification]
inputs = ["skills/**/*", "tests/**/*", "docs/**/*.md", "pyproject.toml", "uv.lock", "scripts/**/*", "AGENTS.md", "CLAUDE.md", "README.md"]
budget_seconds = 1800
reuse_seconds = 3600
environment = ["TAO_NATIVE_ACCEPTANCE"]

[[verification.checks]]
id = "python-tests"
argv = ["uv", "run", "--no-config", "--locked", "--extra", "publication", "python", "tests/acceptance/quality.py"]
timeout_seconds = 1700
metrics = {format = "coverage-json", path = "tmp/tao/coverage/coverage.json"}

[[verification.checks]]
id = "python-lint"
# Ruff reads only these two trees; its version is pinned by pyproject.toml and
# uv.lock, and every rule comes from argv, so there is no separate config file.
# python-tests declares nothing: it really does depend on the managed documents.
inputs = ["skills/tao-dev/scripts/**/*", "scripts/**/*", "tests/**/*", "pyproject.toml", "uv.lock"]
argv = ["uv", "run", "--no-config", "--locked", "--extra", "publication", "python", "-m", "ruff", "check", "--select", "E9,F63,F7,F82", "--output-format", "json", "--output-file", "tmp/tao/ruff.json", "skills/tao-dev/scripts", "scripts", "tests"]
timeout_seconds = 60
metrics = {format = "ruff-json", path = "tmp/tao/ruff.json"}
