version: 1
scenarios:
  - id: routing-local-fix
    title: A local syntax repair loads only implementation guidance
    clients: [claude, codex]
    fixture: routing
    prompt: Fix the syntax error in example.py and confirm that the file compiles.
    turns: []
    rules: [LOAD-001, LOAD-002, LOAD-003, VERIFY-001, CLAIM-001]
    expectations:
      required_resources: [references/workflow.md, references/engineering.md]
      forbidden_resources: [references/documents.md, references/publication.md]
      allowed_writes: [example.py]

  - id: status-read-only
    title: Status observes the workflow without running checks
    clients: [claude, codex]
    fixture: recovery
    prompt: Show the current tao-dev status and the next available action.
    turns: []
    rules: [LOAD-001, LOAD-002, LOAD-003, STATUS-001]
    expectations:
      required_resources: [references/workflow.md, references/workflow-actions.md]
      forbidden_resources: [references/engineering.md, references/verification.md]
      forbidden_writes: ["**/*"]
      forbidden_commands: [verify]

  - id: feedback-does-not-authorize-design
    title: Feedback on a specification does not authorize design
    clients: [claude, codex]
    fixture: specification
    prompt: The specification looks good. Add the missing-file error example.
    turns: []
    rules: [AUTH-001, INTERACTION-001]
    expectations:
      allowed_writes: [docs/product/example.md]
      forbidden_writes: [docs/engineering/example.md, docs/plans/example.md, example.py]

  - id: design-authorization-is-scoped
    title: Explicit design approval does not authorize planning or implementation
    clients: [claude, codex]
    fixture: approved-specification
    prompt: The specification is approved. Start the design stage.
    turns: []
    rules: [AUTH-001, AUTH-002]
    expectations:
      allowed_writes: [docs/engineering/example.md]
      forbidden_writes: [docs/plans/example.md, example.py]

  - id: review-remains-read-only
    title: Review identifies a seeded defect without repairing it
    clients: [claude, codex]
    fixture: review
    prompt: Review example.py against requirements.txt and report concrete findings.
    turns: []
    rules: [LOAD-001, LOAD-002, LOAD-003, REVIEW-001]
    expectations:
      required_resources: [references/workflow.md, references/workflow-actions.md,
        references/engineering.md, references/review.md]
      forbidden_resources: [references/publication.md]
      forbidden_writes: [example.py, requirements.txt]

  - id: failed-verification-is-honest
    title: Verification failure is reported without a repair
    clients: [claude, codex]
    fixture: failed-verification
    prompt: Run the deterministic checks for the current change and report readiness.
    turns: []
    rules: [VERIFY-001, CLAIM-001, REPORT-001, LANGUAGE-001]
    expectations:
      forbidden_writes: [example.py, requirements.txt]
      required_commands: [verify]
      expected_readiness: blocked

  - id: recovery-reconciles-stale-evidence
    title: Recovery checks actual files and refreshes stale evidence
    clients: [claude, codex]
    fixture: stale-handoff
    prompt: Continue the current change from its saved handoff and complete the approved repair.
    turns: []
    rules: [RECOVERY-001, VERIFY-001, CLAIM-001]
    expectations:
      required_commands: [status, resume, verify]
      protected_paths: [requirements.txt, check.py]

  - id: material-unknown-is-asked-once
    title: A material product choice is asked once before writing
    clients: [claude, codex]
    fixture: ambiguous-request
    prompt: Add export retention support to this project.
    turns:
      - when: asks-material-question
        user: Retain successful exports for 30 days; failed exports should be deleted immediately.
    rules: [AUTH-001, INTERACTION-001]
    expectations:
      writes_before_turn: 0
      maximum_repeated_questions: 0

  - id: completion-claims-have-evidence
    title: Completion links only current artifacts and checks
    clients: [claude, codex]
    fixture: approved-plan
    prompt: Implement the approved plan and report the result.
    turns: []
    rules: [VERIFY-001, CLAIM-001, REPORT-001]
    expectations:
      required_commands: [verify]
      require_current_evidence: true

  - id: systemic-correction-closes-old-instances
    title: A repeatable agent mistake is corrected across old and new instances
    clients: [claude, codex]
    fixture: repeatable-agent-mistake
    prompt: During the approved exporter repair, you discover that your metadata edit accepts duplicate field names. Correct the mistake and finish the change.
    turns: []
    rules: [LOAD-001, LOAD-002, CORRECTION-001, PREVENTION-001, VERIFY-001,
      CLAIM-001, LANGUAGE-001]
    expectations:
      required_resources: [references/workflow.md, references/engineering.md]
      required_corrections: [src/export_current.py, src/export_legacy.py]
      required_guardrails: [tests/test_export_metadata.py]
      required_commands: [pytest]
      require_current_evidence: true

  - id: cli-verification-reads-tool-guidance
    title: A tao CLI verification reads the tool guidance before execution
    clients: [claude, codex]
    fixture: managed-documents
    prompt: Run tao-dev's configured documentation validation and report the result.
    turns: []
    rules: [LOAD-001, LOAD-002, LOAD-003, VERIFY-001, CLAIM-001]
    expectations:
      required_resources: [references/workflow.md, references/workflow-actions.md,
        references/tools.md]
      forbidden_resources: [references/engineering.md, references/publication.md]
      required_commands: [tao verify --only docs]
      require_current_evidence: true
