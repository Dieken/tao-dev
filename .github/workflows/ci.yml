name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --no-config --locked --extra publication

      # Complete project-local skill copy acceptance runs in the deterministic
      # suite without installed clients or credentials. Native discovery is opt-in.
      - name: Run unified check
        run: just check

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: tmp/tao/
          if-no-files-found: ignore

  document-baseline:
    name: Document ID deletion baseline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check out the pull request base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tmp/tao/baseline-project

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --no-config --locked

      - name: Export the base document IDs
        run: >-
          .venv/bin/python scripts/export_document_ids.py
          --project tmp/tao/baseline-project
          --source-revision "${{ github.event.pull_request.base.sha }}"
          > tmp/tao/document-id-baseline.json

      - name: Reject unretired document ID deletion
        run: >-
          .venv/bin/python skills/tao-dev/scripts/tao.py
          verify --baseline tmp/tao/document-id-baseline.json --format json
          > tmp/tao/docs-baseline-verify.json

      - name: Upload baseline diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: document-baseline-diagnostics
          path: tmp/tao/*.json
          if-no-files-found: error
