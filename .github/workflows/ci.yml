name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Floating versions intentionally detect native client compatibility
      # changes. No credentials are configured, so authenticated model
      # acceptance tests skip while CLI-only probes still execute.
      - name: Install Claude Code and Codex
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
          claude --version
          codex --version

      - name: Persist npm global bin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $npmBin = (npm prefix -g).Trim()
          $npmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path = "$npmBin;$env:Path"
          claude --version
          codex --version

      - name: Install Cursor CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          agent --version

      - name: Install Cursor CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm 'https://cursor.com/install?win32=true' | iex
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$HOME\.cursor\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path = "$HOME\.local\bin;$HOME\.cursor\bin;$env:Path"
          agent --version

      - name: Install Kiro CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          kiro-cli --version

      - name: Install Kiro CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = 'https://prod.download.cli.kiro.dev/stable'
          $manifest = Invoke-RestMethod "$base/latest/manifest.json"
          $package = $manifest.packages | Where-Object {
            $_.os -eq 'windows' -and $_.architecture -eq 'x86_64'
          } | Select-Object -First 1
          if (!$package) { throw 'Kiro manifest has no Windows x86_64 package.' }
          $msi = Join-Path $env:RUNNER_TEMP 'kiro-cli.msi'
          Invoke-WebRequest "$base/$($package.download)" -OutFile $msi
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $package.sha256) { throw 'Kiro MSI checksum mismatch.' }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Kiro MSI failed: $($process.ExitCode)" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
            [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path | Out-File -FilePath $env:GITHUB_PATH -Append
          kiro-cli --version

      - uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --no-config --locked --extra publication

      # The same entry point is used locally and in every CI matrix cell.
      # just check prepares locked wheels, runs the configured full pytest
      # suite, runs optional live acceptance when readiness allows it, and
      # performs dependency/lint verification.
      - name: Run unified check
        run: just check

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: tmp/tao/
          if-no-files-found: ignore
