name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --no-config --locked --extra publication

      # Wheels are interpreter- and platform-specific, so each matrix cell
      # downloads its own set instead of reusing another cell's wheelhouse.
      - name: Prepare locked wheels
        run: uv run --no-config --locked --extra publication python tests/acceptance/runtime.py --download

      # Same entry point as the project's own python-tests check in
      # .tao/config.toml, so CI and `tao verify --only code` cannot diverge.
      - name: Run maintained regression
        run: uv run --no-config --locked --extra publication python tests/acceptance/quality.py

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: tmp/tao/
          if-no-files-found: ignore

  native-clients:
    name: Native clients / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Floating versions intentionally detect native client compatibility
      # changes. Real sessions still require an existing login and therefore
      # skip on credential-free GitHub runners.
      - name: Install Claude Code and Codex
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex
          claude --version
          codex --version

      - name: Install Cursor CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          agent --version

      - name: Install Cursor CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm 'https://cursor.com/install?win32=true' | iex
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$HOME\.cursor\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path = "$HOME\.local\bin;$HOME\.cursor\bin;$env:Path"
          agent --version

      - name: Install Kiro CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          kiro-cli --version

      - name: Install Kiro CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = 'https://prod.download.cli.kiro.dev/stable'
          $manifest = Invoke-RestMethod "$base/latest/manifest.json"
          $package = $manifest.packages | Where-Object {
            $_.os -eq 'windows' -and $_.architecture -eq 'x86_64'
          } | Select-Object -First 1
          if (!$package) { throw 'Kiro manifest has no Windows x86_64 package.' }
          $msi = Join-Path $env:RUNNER_TEMP 'kiro-cli.msi'
          Invoke-WebRequest "$base/$($package.download)" -OutFile $msi
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $package.sha256) { throw 'Kiro MSI checksum mismatch.' }
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Kiro MSI failed: $($process.ExitCode)" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
            [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path | Out-File -FilePath $env:GITHUB_PATH -Append
          kiro-cli --version

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --no-config --locked --extra publication

      - name: Prepare locked wheels
        run: uv run --no-config --locked --extra publication python tests/acceptance/runtime.py --download

      # Every environment uses the same rules. Installation probes need only
      # the executable; model sessions additionally require an existing login.
      - name: Run native installation probes
        run: uv run --no-config --locked --extra publication python -m pytest tests/test_install_clients.py -k native -q

      - name: Check real-session readiness
        run: uv run --no-config --locked --extra publication python -m pytest tests/test_native_sessions.py -q

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-diagnostics-${{ matrix.os }}
          path: tmp/tao/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --no-config --locked --extra publication

      # Same argv as the project's own python-lint check in .tao/config.toml.
      - name: Run configured lint check
        run: |
          mkdir -p tmp/tao
          uv run --no-config --locked --extra publication python -m ruff check \
            --select E9,F63,F7,F82 --output-format json --output-file tmp/tao/ruff.json \
            plugins/tao-dev/skills/tao-dev/scripts tests
